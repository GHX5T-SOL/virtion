[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  function = "backend-proxy"
  path = "/voice/*"

[[edge_functions]]
  function = "backend-proxy"
  path = "/agent/*"

[[edge_functions]]
  function = "backend-proxy"
  path = "/health"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
